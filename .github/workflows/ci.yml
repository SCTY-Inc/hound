name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.10.4"
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked
      # The HSP-21 acceptance gate. It validates migration/acceptance.v1.json
      # against the repository, then runs the full suite and every CI-safe
      # migration checker the manifest names, so this one command is the
      # acceptance command GOALIE E6 requires.
      - name: Acceptance (manifest + suites + migration checkers)
        run: uv run python migration/check_acceptance.py --run-tests
      # Stage-ledger chain + git-anchor check (append-only invariant): a
      # self-consistent in-place re-derivation of committed entries passes
      # chain verification alone, so the anchor runs explicitly in CI.
      - name: Stage ledger (chain + append-only git anchor)
        run: uv run python migration/check_stage_ledger.py --ledger migration/stage-ledger.v1.json
      - run: uv build
      - name: Smoke-test the built wheel
        run: |
          uv venv /tmp/hound-smoke
          uv pip install --python /tmp/hound-smoke/bin/python dist/*.whl
          /tmp/hound-smoke/bin/hound --version
          /tmp/hound-smoke/bin/hound --help >/dev/null
          /tmp/hound-smoke/bin/hound-research --help >/dev/null
          /tmp/hound-smoke/bin/hound-web-adapter 2>/dev/null || test "$?" = 2
          /tmp/hound-smoke/bin/python -c \
            'import hound_cli, hound_research, hound_web_adapters'
