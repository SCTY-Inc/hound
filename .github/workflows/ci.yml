name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.10.4"
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked
      - run: uv run pytest -q
      - run: uv build
      - name: Smoke-test the built wheel
        run: |
          uv venv /tmp/hound-smoke
          uv pip install --python /tmp/hound-smoke/bin/python dist/*.whl
          /tmp/hound-smoke/bin/hound --version
          /tmp/hound-smoke/bin/hound --help >/dev/null
          /tmp/hound-smoke/bin/hound-research --help >/dev/null
          /tmp/hound-smoke/bin/hound-web-adapter 2>/dev/null || test "$?" = 2
          /tmp/hound-smoke/bin/python -c \
            'import hound_cli, hound_research, hound_web_adapters'
