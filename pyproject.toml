[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "evidence-hound"
version = "0.5.0"
description = "Plan-bound capability execution for Git repositories."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE.md" }
authors = [{ name = "SCTY" }]
keywords = ["cli", "agents", "provenance", "git"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/SCTY-Inc/hound"
Repository = "https://github.com/SCTY-Inc/hound.git"
Issues = "https://github.com/SCTY-Inc/hound/issues"

[project.scripts]
hound = "hound_cli.cli:main"
hound-research = "hound_research.cli:main"
hound-lane-run = "hound_research.lane_run:main"
hound-web-adapter = "hound_web_adapters.cli:main"
houndd = "houndd.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hound_cli", "src/hound_client", "src/hound_research", "src/hound_web_adapters", "src/houndd"]

[tool.pytest.ini_options]
addopts = "-ra --ignore=tests/test_slice3a_evidence.py"
testpaths = ["tests"]
